<style>
:root{
  --bg:#121212; --surface:#1e1e1e; --hover:#2a2a2a; --text:#fff; --muted:#a0a0a0; --accent:#38bdf8; --ok:#34d399; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  padding:40px 20px env(safe-area-inset-bottom,20px);display:flex;flex-direction:column;align-items:center}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.i{width:1em;height:1em;fill:currentColor;display:inline-block;vertical-align:-.125em;flex:none}
.lang-btn{position:fixed;top:16px;right:16px;z-index:100;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--surface);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;color:var(--text);font:700 12px inherit;
  font-family:inherit;cursor:pointer;transition:.3s}
.lang-btn:hover{border-color:var(--accent);background:rgba(56,189,248,.1)}
.lang-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.profile{text-align:center;margin:20px 0 24px}
.profile img{width:110px;height:110px;border-radius:50%;border:3px solid var(--accent);object-fit:cover;margin-bottom:16px;box-shadow:0 8px 24px rgba(56,189,248,.2);background:#fff}
h1{font-size:1.7rem;letter-spacing:-.5px;margin-bottom:6px}
.subtitle{color:var(--muted);font-weight:500}
.about{color:var(--muted);font-size:.92rem;line-height:1.55;margin-top:14px;max-width:380px}
.wrap{width:100%;max-width:400px;display:flex;flex-direction:column;gap:28px;flex:1}
.group{display:flex;flex-direction:column;gap:12px}
h2{font-size:1.05rem;font-weight:700;padding-left:4px}
.btn{text-decoration:none;color:var(--text);background:var(--surface);padding:16px 20px;border-radius:var(--r);font:600 1rem inherit;
  font-family:inherit;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.05);transition:.3s;cursor:pointer;text-align:left;width:100%}
.btn:hover{background:var(--hover);transform:translateY(-2px);border-color:rgba(255,255,255,.1)}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--accent);color:#04202e;justify-content:center;font-size:1.05rem}
.btn.main:hover{background:#7dd3fc}
.ico{font-size:1.3rem;width:28px;display:flex;justify-content:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row .btn{padding:14px;justify-content:center;font-size:.92rem}
.services{list-style:none;display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:var(--r);padding:6px 20px}
.services li{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.services li:last-child{border-bottom:0}
.services b{display:block;font-weight:600}
.services span{color:var(--muted);font-size:.88rem}
.note{color:var(--muted);font-size:.85rem;padding-left:4px}
details{background:var(--surface);border-radius:var(--r);border:1px solid rgba(255,255,255,.05)}
summary{padding:16px 20px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary .chev{font-size:.8rem;color:var(--muted);transition:transform .25s}
details[open] summary .chev{transform:rotate(180deg)}
details .group{padding:0 12px 12px}
.card{background:var(--surface);border:1px solid rgba(255,255,255,.05);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;align-items:stretch;gap:14px}
.card small{color:var(--muted);font-weight:700;font-size:.85rem;letter-spacing:.5px}
.card .visa{color:#60a5fa}.card .humo{color:#facc15}
.num{display:block;white-space:nowrap;font-family:'Courier New',monospace;font-size:clamp(1rem,5.6vw,1.4rem);font-weight:600;letter-spacing:1.2px;margin-top:8px}
.copy{width:100%;background:rgba(255,255,255,.1);color:var(--text);border:0;padding:13px 16px;border-radius:12px;font:600 1rem inherit;font-family:inherit;cursor:pointer;transition:.3s}
.copy:hover{background:var(--accent);color:#000}
.copy.done{background:var(--ok);color:#064e3b}
.tg{color:#38bdf8}.ig{color:#f472b6}.ph{color:#4ade80}.vk{color:#0077ff}.dc{color:#5865f2}.st{color:#66c0f4}
footer{text-align:center;border-top:1px solid rgba(255,255,255,.05);margin-top:40px;padding:32px 16px 16px;font-size:12px;color:var(--muted)}
footer a{color:var(--accent);font-weight:700;text-decoration:none}
footer a:hover{text-decoration:underline}
.toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,100px);background:var(--ok);color:#064e3b;padding:12px 24px;border-radius:30px;
  font-weight:600;transition:transform .4s cubic-bezier(.175,.885,.32,1.275);opacity:0;z-index:1000}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}
