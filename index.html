const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },

let lang = store.get('lang') || ((navigator.language || '').toLowerCase().startsWith('uz') ? 'uz' : 'ru');
if (!T[lang]) lang = 'ru';

function apply() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById('langText').textContent = t.langBtn;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.getElementById('orderBtn').href = 'https://t.me/Eltad0r?text=' + encodeURIComponent(t.orderMsg);
}

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'ru' ? 'uz' : 'ru';
  store.set('lang', lang);
  apply();
});

const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

document.getElementById('copyBtn').addEventListener('click', async e => {
  const btn = e.currentTarget;
  const ok = await copyToClipboard(document.getElementById('cardNum').textContent.replace(/\s+/g, ''));
  if (!ok) return;
  btn.textContent = T[lang].copied;
  btn.classList.add('done');
  showToast(T[lang].toast);
  setTimeout(() => { btn.textContent = T[lang].copy; btn.classList.remove('done'); }, 2000);
});

document.getElementById('shareBtn').addEventListener('click', async () => {
  const url = location.href.split('#')[0];
  if (navigator.share) {
    try { await navigator.share({ title: 'Eltad0r', text: T[lang].subtitle, url }); } catch (e) {}
  } else if (await copyToClipboard(url)) {
    showToast(T[lang].shared);
  }
});
