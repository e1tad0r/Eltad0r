<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yunusov Tech | Контакты</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            margin-bottom: 15px;
            object-fit: cover;
        }
        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        p { color: #94a3b8; margin-bottom: 25px; }

        .links-container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            text-decoration: none;
            color: white;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            border: 1px solid #334155;
            transition: 0.3s;
            display: block;
        }
        .btn:active { transform: scale(0.98); background: #334155; }
        
        /* Цвета для разных кнопок */
        .btn-tg { border-left: 5px solid #0088cc; }
        .btn-inst { border-left: 5px solid #e1306c; }
        .btn-phone { border-left: 5px solid #22c55e; }
    </style>
</head>
<body>

    <img src="logo.jpg" alt="Logo" class="profile-img">
    
    <h1>Yunusov Tech</h1>
    <p>Сборка ПК | Софт | Решения</p>

    <div class="links-container">
        <a href="https://t.me/YunusovTech" class="btn btn-tg">💻 ТГ-канал (Железо)</a>
        
        <a href="https://t.me/SofTech_ahangaran" class="btn btn-tg">⚙️ ТГ-канал (Софт)</a>
        
        <a href="https://t.me/Eltad0r" class="btn btn-tg">💬 Написать в Личку (тг)</a>
        
        <a href="https://www.instagram.com/e1tad0r/" class="btn btn-inst">📸 Instagram</a>
        
        <a href="tel:+998931942706" class="btn btn-phone">📞 Позвонить мне</a>
    </div>

</body>
</html>
